name: Build Unique Outlet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app ZIP
        run: |
          mkdir extracted
          unzip -q unique-outlet-GITHUB-READY-ROOT.zip -d extracted
          cp -r extracted/* .
          cp -r extracted/.[!.]* . 2>/dev/null || true

      - name: Fix Flutter package name
        run: |
          sed -i 's/^name: .*/name: unique_outlet_app/' pubspec.yaml

      - name: Create missing brand theme
        run: |
          mkdir -p lib/services
          cat > lib/services/brand_theme.dart <<'EOF'
          import 'package:flutter/material.dart';

          class UOBrand {
            static ThemeData theme() {
              return ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFFE30613),
                ),
                scaffoldBackgroundColor: Colors.white,
                appBarTheme: const AppBarTheme(
                  backgroundColor: Colors.white,
                  foregroundColor: Colors.black,
                  elevation: 0,
                ),
              );
            }
          }
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Prepare Android project
        run: |
          rm -rf android
          flutter create --project-name unique_outlet_app --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unique-outlet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
